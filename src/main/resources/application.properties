spring.application.name=controlefinanceiro

app.jwt.secret=${JWT_SECRET:controlefinanceiro-development-secret-change-me-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/controlefinanceiro}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# WhatsApp: token opcional para validar chamadas do webhook do provedor
# (Twilio/Meta). Deixe vazio para aceitar qualquer chamada (modo de teste).
app.whatsapp.webhook-token=${WHATSAPP_WEBHOOK_TOKEN:}
