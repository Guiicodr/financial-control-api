spring.application.name=controlefinanceiro

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/controlefinanceiro}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:change-me}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# WhatsApp: token para validar chamadas do webhook do provedor (Twilio/Meta).
# Sem valor padrão de propósito: se não estiver configurado no Railway, o
# webhook responde 401 em vez de aceitar qualquer POST anônimo (qualquer
# pessoa poderia lançar despesas na conta de outro usuário só sabendo o
# telefone dele).
app.whatsapp.webhook-token=${WHATSAPP_WEBHOOK_TOKEN:}

# Meta WhatsApp Cloud API (para o bot RESPONDER no chat):
# WHATSAPP_TOKEN = token de acesso permanente do app Meta
# WHATSAPP_PHONE_NUMBER_ID = ID do número de telefone do app Meta
app.whatsapp.meta.token=${WHATSAPP_TOKEN:}
app.whatsapp.meta.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# Número público do bot (só dígitos, com DDI) exibido no front para abrir o chat.
# Ex.: Twilio sandbox = 14155238886 | Meta = o número do seu app.
app.whatsapp.bot-number=${WHATSAPP_BOT_NUMBER:}

# CORS: lista EXPLÍCITA de origens do front separadas por vírgula.
# Produção (Railway): CORS_ALLOWED_ORIGINS=https://seu-dominio.vercel.app
# Se vazio, apenas o alias canônico do projeto é aceito. Localhost é liberado
# automaticamente quando o profile "dev" está ativo.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Reabre https://*.vercel.app para testar preview deploys. Manter false.
app.cors.allow-vercel-previews=${CORS_ALLOW_VERCEL_PREVIEWS:false}

# Rate limit (janela fixa por IP) para os endpoints públicos.
# /auth/** é o alvo de brute force; /webhooks/** é público e grava dados.
app.rate-limit.auth-requests=${RATE_LIMIT_AUTH_REQUESTS:20}
app.rate-limit.webhook-requests=${RATE_LIMIT_WEBHOOK_REQUESTS:60}
app.rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:60000}

# Usuário de teste do profile dev. Definir false para desabilitar o seed.
app.dev.seed-test-user=${DEV_SEED_TEST_USER:true}

# O token de recuperação de senha NUNCA é exposto em produção (ver AuthService).
# Sem envio de e-mail configurado, habilitar isto só faz sentido em dev.
app.reset-token.log-for-dev=${RESET_TOKEN_LOG_FOR_DEV:false}

# Versao vigente dos documentos legais (Termos de Uso + Aviso de Privacidade).
# Fica gravada junto do cadastro como prova do aceite (LGPD art. 8, §1º) e e
# devolvida em GET /usuario/dados. Ao publicar uma versao nova dos textos,
# atualizar tambem o front (src/lib/legal.js), que envia a versao no cadastro.
app.legal.terms-version=${LEGAL_TERMS_VERSION:2026-09-1}

# Retencao de credenciais (LGPD arts. 15 e 16): expurgo diario dos tokens de
# refresh e de recuperacao de senha que ja venceram. Cron no formato do Spring
# (segundo minuto hora dia-mes mes dia-semana). Padrao: todo dia as 03:30.
app.retention.token-cleanup-cron=${RETENTION_TOKEN_CLEANUP_CRON:0 30 3 * * *}
