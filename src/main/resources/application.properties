spring.application.name=controlefinanceiro
app.jwt.secret=${JWT_SECRET:controlefinanceiro-development-secret-change-me-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:h2:file:./data/controlefinanceiro
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.h2.console.settings.web-allow-others=true
