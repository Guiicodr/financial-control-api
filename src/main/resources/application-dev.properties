# Configurações aplicadas SOMENTE quando o profile "dev" está ativo.

# O fluxo de recuperação de senha ainda não envia e-mail (ver AuthService).
# Em dev, imprimir o token no log permite testar /auth/reset-password.
app.reset-token.log-for-dev=true

# Cria o usuário de teste teste@teste.com / teste123 no banco local.
app.dev.seed-test-user=true
